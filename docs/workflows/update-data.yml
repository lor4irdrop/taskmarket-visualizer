name: Update market data
on:
  schedule:
    - cron: "7 * * * *" # hourly, a few minutes past the hour
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch Taskmarket API
        run: node scripts/fetch-data.mjs
      - name: Regenerate share image
        run: python3 scripts/make_og.py
      - name: Commit data
        run: |
          git config user.name "taskmarket-visualizer-bot"
          git config user.email "bot@taskmarket-visualizer.local"
          git add data og.png
          git diff --cached --quiet || git commit -m "data: hourly refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
